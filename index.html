<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ช่วยน้องแมวจร 🐱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    body{ font-family:'Prompt',sans-serif; background:#fffaf7; color:#333; }
    .glass{ background:rgba(255,255,255,.75); backdrop-filter:blur(12px); }
  </style>
</head>
<body>

<nav class="fixed top-0 left-0 right-0 z-50 glass border-b border-orange-100">
  <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="text-4xl">🐱</div>
      <div>
        <div class="font-bold text-xl">ช่วยน้องแมวจร</div>
        <div class="text-sm text-gray-500">อัปเดตการรักษาน้องแมว</div>
      </div>
    </div>
    <button id="loginBtn" onclick="handleAdminAuth()" class="bg-orange-500 hover:bg-orange-600 transition text-white px-5 py-3 rounded-full shadow-lg font-semibold">
      🔐 Owner Login
    </button>
  </div>
</nav>

<section class="relative h-screen overflow-hidden">
  <img src="https://raw.githubusercontent.com/jrwx/cat-help/main/cat.jpeg" class="w-full h-full object-cover" />
  <div class="absolute inset-0 bg-black/50"></div>
  <div class="absolute inset-0 flex items-center justify-center px-6">
    <div class="text-center text-white max-w-4xl">
      <div class="text-7xl mb-5">🐾</div>
      <h1 class="text-5xl md:text-7xl font-bold leading-tight">ช่วยน้องแมวจร</h1>
      <p class="mt-6 text-lg md:text-2xl text-white/90 leading-relaxed">อัปเดตค่ารักษา อาการล่าสุด และรายรับรายจ่ายของน้องแมว</p>
      <div id="statusBox" class="mt-8 inline-flex items-center gap-3 bg-green-500 px-6 py-3 rounded-full text-lg font-semibold shadow-2xl">💖 เปิดรับบริจาคอยู่</div>
    </div>
  </div>
</section>

<section class="max-w-6xl mx-auto px-5 -mt-24 relative z-20">
  <div class="grid md:grid-cols-3 gap-6">
    <div class="bg-white rounded-3xl shadow-xl p-8 text-center">
      <div class="text-5xl mb-4">💰</div>
      <div class="text-gray-500 text-lg">ยอดบริจาคทั้งหมด</div>
      <div id="totalDonation" class="text-4xl font-bold mt-4 text-orange-500">0 บาท</div>
    </div>
    <div class="bg-white rounded-3xl shadow-xl p-8 text-center">
      <div class="text-5xl mb-4">🏥</div>
      <div class="text-gray-500 text-lg">ค่ารักษาที่ใช้ไป</div>
      <div id="totalExpense" class="text-4xl font-bold mt-4 text-red-500">0 บาท</div>
    </div>
    <div class="bg-white rounded-3xl shadow-xl p-8 text-center">
      <div class="text-5xl mb-4">🐾</div>
      <div class="text-gray-500 text-lg">เงินคงเหลือ</div>
      <div id="balanceAmount" class="text-4xl font-bold mt-4 text-green-500">0 บาท</div>
    </div>
  </div>
</section>

<section id="ownerPanel" class="hidden max-w-6xl mx-auto px-5 py-12">
  <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-orange-100">
    <div class="bg-orange-500 text-white p-6">
      <h2 class="text-3xl font-bold">🛠️ แผงควบคุมผู้ดูแล</h2>
    </div>
    <div class="p-8 space-y-6">
      <div class="p-5 bg-orange-50/50 rounded-2xl border border-orange-100 space-y-4">
        <h4 class="font-bold text-orange-600 text-lg">➕ เพิ่มบันทึกอาการประจำวัน</h4>
        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="text-sm font-semibold block mb-1">📅 วันที่</label>
            <input id="newLogDate" type="date" class="w-full p-3 rounded-xl border border-orange-200 bg-white" />
          </div>
          <div>
            <label class="text-sm font-semibold block mb-1">🖼️ เลือกรูป (แนะนำไม่เกิน 3-4 รูป)</label>
            <input id="newLogImagesInput" type="file" accept="image/*" multiple class="w-full p-2 rounded-xl border border-orange-200 bg-white text-sm" />
          </div>
        </div>
        <textarea id="newLogContent" rows="2" placeholder="รายละเอียดอาการ..." class="w-full p-3 rounded-xl border border-orange-200 bg-white"></textarea>
        <button id="addLogBtn" onclick="addNewConditionLog()" class="w-full bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-xl font-semibold">✨ บันทึกอาการ</button>
      </div>
    </div>
  </div>
</section>

<section class="max-w-6xl mx-auto px-5 py-10">
  <div class="bg-white rounded-3xl shadow-xl overflow-hidden">
    <div class="bg-orange-50 p-6"><h2 class="text-3xl font-bold">🏥 บันทึกอาการวันต่อวัน</h2></div>
    <div id="timelineContainer" class="p-8 space-y-6"></div>
  </div>
</section>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDLL5PYwQ3aHxeA-PszAh2x3mJxTUDXdpY",
  authDomain: "cat-help-18ffb.firebaseapp.com",
  projectId: "cat-help-18ffb",
  storageBucket: "cat-help-18ffb.firebasestorage.app",
  messagingSenderId: "545008804888",
  appId: "1:545008804888:web:97d6c2c6dd228db8138f6d"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const logsCollectionRef = db.collection("daily_logs");
let isOwnerLoggedIn = false;

// ฟังก์ชันบีบอัดรูป
function compressAndResizeImage(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const MAX_WIDTH = 600;
        let width = img.width;
        let height = img.height;
        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.5));
      };
    };
  });
}

// ฟังก์ชันเพิ่มบันทึกอาการ
async function addNewConditionLog() {
  if (!isOwnerLoggedIn) return alert("กรุณาล็อกอิน");
  const filesInput = document.getElementById("newLogImagesInput");
  const contentVal = document.getElementById("newLogContent").value;
  const btn = document.getElementById("addLogBtn");
  if (!contentVal) return alert("กรุณากรอกรายละเอียด");

  btn.disabled = true;
  btn.innerText = "⏳ กำลังบันทึก...";
  try {
    const newLogRef = await logsCollectionRef.add({
      date: document.getElementById("newLogDate").value,
      content: contentVal,
      logTimestamp: Date.now()
    });
    if (filesInput.files.length > 0) {
      for (let i = 0; i < filesInput.files.length; i++) {
        btn.innerText = `⏳ อัปโหลดรูปที่ ${i + 1}/${filesInput.files.length}...`;
        const base64 = await compressAndResizeImage(filesInput.files[i]);
        await newLogRef.collection("images").add({ base64, uploadedAt: Date.now() });
      }
    }
    alert("บันทึกเรียบร้อย!");
    location.reload();
  } catch (e) { alert("Error: " + e.message); btn.disabled = false; btn.innerText = "✨ บันทึกอาการ"; }
}

function handleAdminAuth() {
  if (isOwnerLoggedIn) { location.reload(); }
  else {
    const pass = prompt("รหัสผ่าน:");
    if (pass === "12345") {
      isOwnerLoggedIn = true;
      document.getElementById("ownerPanel").classList.remove("hidden");
      document.getElementById("loginBtn").innerText = "🚪 Logout";
    } else { alert("รหัสผิด"); }
  }
}
</script>
</body>
</html>
